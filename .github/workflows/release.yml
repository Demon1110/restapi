# 自动升级版本 + 自动发布 GitHub Release
# 触发时机：仅手动触发（在仓库 Actions 页面点击 Run workflow）。
# 运行时自动将 pom.xml 版本号 patch+1，先执行 Maven 打包，
# 把 target/restapi.jar 复制到 releases/，再提交版本升级和 JAR，
# 推送 vX.Y.Z 标签，最后自动创建 GitHub Release。

name: Auto Build, Version Bump & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ---- 1. 自动升级版本号（patch +1）----
      - name: Bump version
        id: bump
        run: |
          current=$(grep -oPm1 '(?<=<version>)[^<]+(?=</version>)' pom.xml)
          echo "current=$current"

          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | awk -F. '{print ($2!="" ? $2 : "0")}')
          patch=$(echo "$current" | awk -F. '{print ($3!="" ? $3 : "0")}')
          new="$major.$minor.$((patch+1))"
          echo "new=$new"
          echo "NEW_VERSION=$new" >> "$GITHUB_ENV"

          awk -v nv="$new" '
            /<artifactId>restapi<\/artifactId>/ { target=1 }
            target && /<version>/ { sub(/<version>[^<]+<\/version>/, "<version>" nv "</version>"); target=0 }
            { print }
          ' pom.xml > pom.xml.tmp && mv pom.xml.tmp pom.xml

          echo "pom version now: $(grep -A1 '<artifactId>restapi</artifactId>' pom.xml | grep '<version>')"

      # ---- 2. Maven 打包 ----
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # ---- 3. 把 JAR 放到 releases 目录 ----
      - name: Copy JAR to releases directory
        run: |
          mkdir -p releases
          cp target/restapi.jar releases/restapi.jar

      # ---- 4. 提交版本升级并推送 tag ----
      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pom.xml releases/restapi.jar

          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore: bump version to v${{ env.NEW_VERSION }}"
          fi

          git push origin HEAD:${GITHUB_REF_NAME:-main}
          git tag -f "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}" --force

      # ---- 5. 自动创建 GitHub Release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          name: "v${{ env.NEW_VERSION }}"
          generate_release_notes: true
          files: releases/restapi.jar
