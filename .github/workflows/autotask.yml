name: Auto Task for Stock Analysis

on:
  schedule:
    - cron: '0 1,4,7,11 * * *'  # 北京时间 9:00, 12:00, 15:00, 19:00 -> UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stock-analysis:
    runs-on: ubuntu-latest
    env:
      STOCK_DATA_DIR: ${{ github.workspace }}/data/stock

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Prepare stock data directory
        run: mkdir -p "$STOCK_DATA_DIR"

      - name: Run StockCollectService main method
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          echo "Stock data dir: $STOCK_DATA_DIR"
          mkdir -p "$STOCK_DATA_DIR"
          # 先 compile 再 exec:java（exec:java 不会自动编译，否则 target/classes 为空会 ClassNotFound）
          mvn -B compile exec:java -Dexec.mainClass="com.cary.core.restapi.service.StockCollectService" -Dexec.args=""

      - name: git add and commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # 无数据变更时跳过提交与推送，避免工作流报错
          if git diff --cached --quiet; then
            echo "No stock data changes, skip commit and push."
            exit 0
          fi
          git commit -m "Auto task for stock data"
          git push