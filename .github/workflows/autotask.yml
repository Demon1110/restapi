name: Auto Task for Stock Analysis

on:
  schedule:
    - cron: '0 1,4,7,11 * * *'  # UTC -> 北京时间 9:00,12:00,15:00,19:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stock-analysis:
    runs-on: ubuntu-latest
    env:
      STOCK_DATA_DIR: ${{ github.workspace }}/data/stock
      MAVEN_REPO: ~/.m2/repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # ✅ 删掉 cache: none，v5 不支持，不写就是关闭内置缓存

      # 阿里云Maven镜像，国内加速
      - name: Config maven aliyun mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
  <settings>
  <mirrors>
  <mirror>
  <id>aliyunmaven</id>
  <mirrorOf>central</mirrorOf>
  <name>阿里云公共仓库</name>
  <url>https://maven.aliyun.com/repository/public</url>
  </mirror>
  </mirrors>
  </settings>
  EOF

  # Maven依赖缓存
  - name: Cache Maven dependencies
    uses: actions/cache@v4
    with:
      path: ${{ env.MAVEN_REPO }}
      key: maven-repo-${{ hashFiles('pom.xml') }}
      restore-keys: |
        maven-repo-

  # target编译产物缓存
  - name: Cache target compiled classes
    uses: actions/cache@v4
    with:
      path: target
      key: maven-target-${{ hashFiles('pom.xml', 'src/**/*.java') }}
      restore-keys: |
        maven-target-

  - name: Prepare stock data directory
    run: mkdir -p "$STOCK_DATA_DIR"

  - name: Run StockCollectService main method
    env:
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
    run: |
      echo "Stock data dir: $STOCK_DATA_DIR"
      mkdir -p "$STOCK_DATA_DIR"
      # 缓存存在就离线跑，不走网络；缺失则联网下载依赖
      if [ -d "$MAVEN_REPO" ] && [ "$(ls -A $MAVEN_REPO)" ]; then
        echo "✅ Cache hit, run maven offline"
        mvn -B -T 1C --offline compile exec:java -Dexec.mainClass="com.cary.core.restapi.service.StockCollectService" -Dexec.args=""
      else
        echo "⚠️ Cache miss, download dependencies online"
        mvn -B -T 1C compile exec:java -Dexec.mainClass="com.cary.core.restapi.service.StockCollectService" -Dexec.args=""
      fi

  - name: git add and commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add .
      if git diff --cached --quiet; then
        echo "No stock data changes, skip commit and push."
        exit 0
      fi
      git commit -m "Auto task for stock data"
      git push
