name: Auto Task for Stock Analysis

on:
  schedule:
    - cron: '0 9,12,15,19 * * *'  # 每天9点运行

jobs:
  stock-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run StockCollectService main method
        run: mvn exec:java -Dexec.mainClass="com.cary.core.restapi.service.StockCollectService" -Dexec.args=""
